[package]
name = "aurelius-desktop"
description = "Native GPUI desktop client. Renders read models and sends commands; owns no state of truth."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "aurelius"
path = "src/main.rs"

[dependencies]
aurelius-domain.workspace = true
aurelius-protocol.workspace = true
aurelius-host.workspace = true
aurelius-client.workspace = true
gpui-kit = "=0.7.0"
qrcode = { version = "0.14", default-features = false }
tokio.workspace = true
anyhow.workspace = true
serde_json.workspace = true
# ```mermaid blocks in markdown views, drawn to SVG without a browser.
mermaid-rs-renderer = { version = "0.3", default-features = false }
tracing.workspace = true
tracing-subscriber.workspace = true

# Artifacts' HTML in the side panel (WebView2, a child window of the app's window).
[target.'cfg(windows)'.dependencies]
wry = { version = "0.57", default-features = false }

[dev-dependencies]
# The board member flow against a real daemon on a temporary folder.
aurelius-daemon = { path = "../../crates/daemon" }
tempfile.workspace = true
# Paused time for the refresh throttle's test.
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
winresource = "0.1"
