# aurelius-mcp in Docker: MCP at http://<host>:7464/mcp. See docs/aurelius-mcp.md, "Docker".
#
#   AURELIUS_MCP_URL=https://<pc>.<tailnet>.ts.net:8443 docker compose up -d
#
# or put the variables in a .env file next to this one.
services:
  aurelius-mcp:
    # The release image; `docker compose up -d --build` builds it from this checkout instead.
    image: ghcr.io/segrusa/aurelius-mcp:latest
    build: .
    restart: unless-stopped
    ports:
      - "7464:7464"
    environment:
      # The gateway of the Aurelius server: https://<pc>.<tailnet>.ts.net:8443 (dev: 8444),
      # or http://host.docker.internal:47613 (dev: 47614) when Docker runs on the server PC.
      AURELIUS_MCP_URL: ${AURELIUS_MCP_URL:?set AURELIUS_MCP_URL to the gateway address}
      # Optional: the app key for callers that send no Authorization header.
      # Anyone who can reach port 7464 then acts as this app.
      AURELIUS_MCP_KEY: ${AURELIUS_MCP_KEY:-}
      # Optional: "dev" to reach a dev server (dev and production never mix); empty is production.
      AURELIUS_ENV: ${AURELIUS_ENV:-}
    # Lets the container reach the gateway on the Docker host (Linux needs this; Docker Desktop has it).
    extra_hosts:
      - "host.docker.internal:host-gateway"
