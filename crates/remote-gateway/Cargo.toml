[package]
name = "aurelius-remote-gateway"
description = "Optional remote gateway: loopback HTTP + WebSocket behind Tailscale Serve, device pairing, push."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aurelius-domain.workspace = true
aurelius-protocol.workspace = true
aurelius-storage.workspace = true
aurelius-host.workspace = true
# The vault's redactor, as a push leaves.
aurelius-runtime.workspace = true
# `/v1/mcp`: the tools of aurelius-mcp on an in-process session of the app.
aurelius-client.workspace = true
aurelius-mcp.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws", "multipart", "query"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
getrandom.workspace = true
uuid.workspace = true
tracing.workspace = true
thiserror.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", features = ["json", "http2"] }
ring = "0.17"
tower-http = { version = "0.6", default-features = false, features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite = "0.28"
