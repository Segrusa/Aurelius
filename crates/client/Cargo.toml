[package]
name = "aurelius-client"
description = "Pure Rust client library for the daemon protocol (typed calls, no version checks), plus the aurelius-ctl diagnostic CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "aurelius-ctl"
path = "src/main.rs"

[dependencies]
aurelius-domain.workspace = true
aurelius-protocol.workspace = true
aurelius-host.workspace = true
tokio = { workspace = true, features = ["io-std", "fs"] }
thiserror.workspace = true
tracing.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
base64.workspace = true
uuid.workspace = true
# Remote servers: the gateway's HTTPS + WebSocket over Tailscale Serve.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", features = ["json", "multipart"] }
tokio-tungstenite = "0.28"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-platform-verifier = "0.7"


[dev-dependencies]
tempfile.workspace = true
