# Tests on every pull request and every push to main: the server crates
# (Rust, on Linux), the mobile app (Flutter) and the TypeScript clients.
# Goal: done within about 5 minutes.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux, so it stays within a few minutes: deps come from the cache (also
  # saved when tests fail), mold links the many test binaries and nextest runs
  # them in parallel. Windows-only breakage is caught by ci-windows.yml.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      # No debug info: much smaller test binaries, much faster links.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libclang-dev libfontconfig-dev libwayland-dev libgbm-dev libdrm-dev libpipewire-0.3-dev libspa-0.2-dev
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --workspace --no-fail-fast

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clients/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter test

  clients-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm deps
      - run: pnpm exec astryx theme build src/theme/precision/precisionTheme.ts --check
        working-directory: clients/ts/app
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @aurelius/electron package
