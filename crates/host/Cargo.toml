[package]
name = "aurelius-host"
description = "OS integration: power, tray, chrome, terminal, plugins, backups, data paths, host identity, instance lock, user-only IPC and frame codec, secrets, start-up, signed updates and the release tool."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aurelius-domain.workspace = true
aurelius-protocol.workspace = true
aurelius-storage.workspace = true
aurelius-runtime.workspace = true
tokio = { workspace = true, features = ["process"] }
base64.workspace = true
portable-pty = "0.9"
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
tracing.workspace = true
anyhow.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_Time",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Keychain for secrets (connections' API keys, a client's server pairings).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
# The status item of the background service, in the menu bar.
tao = "0.37"
tray-icon = "0.26"

# The status bar icon of the background service (StatusNotifierItem).
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "aurelius-release"
path = "src/bin/aurelius-release.rs"
