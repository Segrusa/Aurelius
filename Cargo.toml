[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/storage",
    "crates/application",
    "crates/runtime",
    "crates/tools",
    "crates/protocol",
    "crates/host",
    "crates/daemon",
    "crates/remote-gateway",
    "crates/client",
    "crates/mcp",
    "crates/agent-bridge",
    "xtask",
    "clients/desktop",
]
# Vendored crates are patched dependencies, not workspace members.
exclude = ["third_party"]

[workspace.package]
version = "0.9.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
aurelius-domain = { path = "crates/domain" }
aurelius-storage = { path = "crates/storage" }
aurelius-application = { path = "crates/application" }
aurelius-runtime = { path = "crates/runtime" }
aurelius-tools = { path = "crates/tools" }
aurelius-protocol = { path = "crates/protocol" }
aurelius-host = { path = "crates/host" }
aurelius-remote-gateway = { path = "crates/remote-gateway" }
aurelius-client = { path = "crates/client" }
aurelius-mcp = { path = "crates/mcp" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
anyhow = "1"
ed25519-dalek = "2"
base64 = "0.22"
getrandom = "0.3"
# Board members' passwords: argon2id, PHC strings (RustCrypto; MIT OR Apache-2.0).
argon2 = { version = "0.5", features = ["std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
schemars = { version = "1", features = ["uuid1"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# Debug info is the bulk of target\ on Windows (tens of GB): keep line
# numbers for our own crates (readable backtraces), none for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

# gpui-base 0.7.0 plus a link hover hook; see third_party/gpui-base/PATCHED.md.
[patch.crates-io]
gpui-base = { path = "third_party/gpui-base" }
