[package]
name = "aurelius-daemon"
description = "Background service: owns SQLite, commands, scheduler and runtimes. One per OS user."
version = "0.9.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "aurelius-daemon"
path = "src/main.rs"

[features]
testing = ["aurelius-runtime/testing", "aurelius-application/testing"]

[dependencies]
base64.workspace = true
aurelius-domain.workspace = true
aurelius-protocol.workspace = true
aurelius-storage.workspace = true
aurelius-application.workspace = true
aurelius-host.workspace = true
aurelius-runtime.workspace = true
aurelius-tools.workspace = true
aurelius-remote-gateway.workspace = true
tokio = { workspace = true, features = ["process"] }
serde_json = { workspace = true, features = ["preserve_order"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
uuid.workspace = true
ignore = "0.4"
image.workspace = true
# MCP OAuth login: discovery, registration and the token request.
reqwest = { version = "0.13", features = ["json"] }
url = "2"
sha2.workspace = true
rusqlite.workspace = true
hex.workspace = true
getrandom.workspace = true
sysinfo = { version = "0.31", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
aurelius-daemon = { path = ".", features = ["testing"] }
reqwest = { version = "0.13", features = ["json", "multipart"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
base64.workspace = true
rusqlite.workspace = true
async-trait = "0.1"
aurelius-client.workspace = true
aurelius-mcp.workspace = true
tempfile.workspace = true

[build-dependencies]
winresource = "0.1"
